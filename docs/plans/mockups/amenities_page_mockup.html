<div style="max-width:680px">
  <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);margin-bottom:1rem">
    <i class="ti ti-home" style="font-size:14px" aria-hidden="true"></i>
    <i class="ti ti-chevron-right" style="font-size:12px" aria-hidden="true"></i>
    <span>Amenities</span>
  </div>

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem">
    <div style="width:32px;height:32px;border-radius:50%;background:var(--bg-accent);display:flex;align-items:center;justify-content:center">
      <i class="ti ti-calendar" style="font-size:16px;color:var(--text-accent)" aria-hidden="true"></i>
    </div>
    <h1 style="margin:0">Amenities</h1>
  </div>

  <div style="display:flex;gap:20px;border-bottom:0.5px solid var(--border);margin-bottom:1.25rem">
    <div style="padding-bottom:8px;border-bottom:2px solid var(--border-accent);font-size:14px;font-weight:500;color:var(--text-accent)">Amenities</div>
    <div style="padding-bottom:8px;font-size:14px;color:var(--text-secondary)">My bookings</div>
    <div style="padding-bottom:8px;font-size:14px;color:var(--text-secondary)">Calendar</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px">

    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;display:flex">
      <div style="width:120px;min-width:120px;height:100px;background:var(--bg-success);display:flex;align-items:center;justify-content:center">
        <i class="ti ti-tennis" style="font-size:32px;color:var(--text-success)" aria-hidden="true"></i>
      </div>
      <div style="flex:1;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px">
        <div style="display:flex;align-items:center;justify-content:between;gap:8px">
          <span style="font-weight:500;font-size:15px">Tennis court</span>
          <span style="margin-left:auto;background:var(--bg-success);color:var(--text-success);font-size:12px;padding:2px 8px;border-radius:var(--radius)">Open</span>
        </div>
        <div style="font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:5px">
          <i class="ti ti-clock" style="font-size:14px" aria-hidden="true"></i>06:00 – 21:30
        </div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button style="font-size:13px;padding:6px 12px">Book</button>
          <button style="font-size:13px;padding:6px 10px" aria-label="Info"><i class="ti ti-info-circle" style="font-size:15px" aria-hidden="true"></i></button>
          <button style="font-size:13px;padding:6px 10px" aria-label="Call"><i class="ti ti-phone" style="font-size:15px" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>

    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;display:flex">
      <div style="width:120px;min-width:120px;height:100px;background:var(--bg-warning);display:flex;align-items:center;justify-content:center">
        <i class="ti ti-swimming" style="font-size:32px;color:var(--text-warning)" aria-hidden="true"></i>
      </div>
      <div style="flex:1;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-weight:500;font-size:15px">Pool deck</span>
          <span style="margin-left:auto;background:var(--bg-warning);color:var(--text-warning);font-size:12px;padding:2px 8px;border-radius:var(--radius)">Closes 18:00</span>
        </div>
        <div style="font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:5px">
          <i class="ti ti-clock" style="font-size:14px" aria-hidden="true"></i>08:00 – 18:00
        </div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button style="font-size:13px;padding:6px 12px">Book</button>
          <button style="font-size:13px;padding:6px 10px" aria-label="Info"><i class="ti ti-info-circle" style="font-size:15px" aria-hidden="true"></i></button>
          <button style="font-size:13px;padding:6px 10px" aria-label="Call"><i class="ti ti-phone" style="font-size:15px" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>

    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;display:flex">
      <div style="width:120px;min-width:120px;height:100px;background:var(--surface-1);display:flex;align-items:center;justify-content:center">
        <i class="ti ti-parking" style="font-size:32px;color:var(--text-secondary)" aria-hidden="true"></i>
      </div>
      <div style="flex:1;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-weight:500;font-size:15px">Visitor parking</span>
          <span style="margin-left:auto;background:var(--surface-1);color:var(--text-secondary);font-size:12px;padding:2px 8px;border-radius:var(--radius)">Always open</span>
        </div>
        <div style="font-size:13px;color:var(--text-secondary)">No booking needed — contact security to register a visitor.</div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button style="font-size:13px;padding:6px 10px" aria-label="Info"><i class="ti ti-info-circle" style="font-size:15px" aria-hidden="true"></i></button>
          <button style="font-size:13px;padding:6px 10px" aria-label="Call"><i class="ti ti-phone" style="font-size:15px" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>

    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;display:flex">
      <div style="width:120px;min-width:120px;height:100px;background:var(--bg-danger);display:flex;align-items:center;justify-content:center">
        <i class="ti ti-fire" style="font-size:32px;color:var(--text-danger)" aria-hidden="true"></i>
      </div>
      <div style="flex:1;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-weight:500;font-size:15px">Braai area</span>
          <span style="margin-left:auto;background:var(--bg-danger);color:var(--text-danger);font-size:12px;padding:2px 8px;border-radius:var(--radius)">Booked today</span>
        </div>
        <div style="font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:5px">
          <i class="ti ti-clock" style="font-size:14px" aria-hidden="true"></i>10:00 – 22:00
        </div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button style="font-size:13px;padding:6px 12px">Join waitlist</button>
          <button style="font-size:13px;padding:6px 10px" aria-label="Info"><i class="ti ti-info-circle" style="font-size:15px" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>

  </div>

  <div style="text-align:center;margin-top:1.5rem;padding:1rem;border-top:0.5px solid var(--border)">
    <p style="font-size:13px;color:var(--text-secondary);margin:0 0 8px">Know of a facility that should be listed here?</p>
    <button style="font-size:13px;padding:6px 14px">Chat to management</button>
  </div>
</div>
