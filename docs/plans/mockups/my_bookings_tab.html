<div style="max-width:680px">
  <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);margin-bottom:1rem">
    <i class="ti ti-home" style="font-size:14px" aria-hidden="true"></i>
    <i class="ti ti-chevron-right" style="font-size:12px" aria-hidden="true"></i>
    <span>Amenities</span>
  </div>

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem">
    <div style="width:32px;height:32px;border-radius:50%;background:var(--bg-accent);display:flex;align-items:center;justify-content:center">
      <i class="ti ti-calendar" style="font-size:16px;color:var(--text-accent)" aria-hidden="true"></i>
    </div>
    <h1 style="margin:0">Amenities</h1>
  </div>

  <div style="display:flex;gap:20px;border-bottom:0.5px solid var(--border);margin-bottom:1.25rem">
    <div style="padding-bottom:8px;font-size:14px;color:var(--text-secondary)">Amenities</div>
    <div style="padding-bottom:8px;border-bottom:2px solid var(--border-accent);font-size:14px;font-weight:500;color:var(--text-accent)">My bookings</div>
    <div style="padding-bottom:8px;font-size:14px;color:var(--text-secondary)">Calendar</div>
  </div>

  <p style="font-size:13px;color:var(--text-secondary);margin:0 0 10px">Upcoming</p>
  <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem">

    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px">
      <div style="width:44px;height:44px;border-radius:var(--radius);background:var(--bg-success);display:flex;align-items:center;justify-content:center;min-width:44px">
        <i class="ti ti-tennis" style="font-size:20px;color:var(--text-success)" aria-hidden="true"></i>
      </div>
      <div style="flex:1">
        <div style="font-weight:500;font-size:14px">Tennis court</div>
        <div style="font-size:13px;color:var(--text-secondary)">Wed 12 Aug, 09:00 – 10:00</div>
      </div>
      <span style="background:var(--bg-success);color:var(--text-success);font-size:12px;padding:2px 8px;border-radius:var(--radius)">Confirmed</span>
      <button style="font-size:13px;padding:6px 10px" aria-label="Cancel booking"><i class="ti ti-x" style="font-size:14px" aria-hidden="true"></i></button>
    </div>

    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px">
      <div style="width:44px;height:44px;border-radius:var(--radius);background:var(--bg-danger);display:flex;align-items:center;justify-content:center;min-width:44px">
        <i class="ti ti-fire" style="font-size:20px;color:var(--text-danger)" aria-hidden="true"></i>
      </div>
      <div style="flex:1">
        <div style="font-weight:500;font-size:14px">Braai area</div>
        <div style="font-size:13px;color:var(--text-secondary)">Sat 15 Aug, 17:00 – 20:00</div>
      </div>
      <span style="background:var(--bg-warning);color:var(--text-warning);font-size:12px;padding:2px 8px;border-radius:var(--radius)">Waitlisted</span>
      <button style="font-size:13px;padding:6px 10px" aria-label="Cancel booking"><i class="ti ti-x" style="font-size:14px" aria-hidden="true"></i></button>
    </div>

  </div>

  <p style="font-size:13px;color:var(--text-secondary);margin:0 0 10px">Past</p>
  <div style="display:flex;flex-direction:column;gap:10px">

    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;opacity:0.7">
      <div style="width:44px;height:44px;border-radius:var(--radius);background:var(--surface-1);display:flex;align-items:center;justify-content:center;min-width:44px">
        <i class="ti ti-swimming" style="font-size:20px;color:var(--text-secondary)" aria-hidden="true"></i>
      </div>
      <div style="flex:1">
        <div style="font-weight:500;font-size:14px">Pool deck</div>
        <div style="font-size:13px;color:var(--text-secondary)">Mon 3 Aug, 12:00 – 13:00</div>
      </div>
      <span style="background:var(--surface-1);color:var(--text-secondary);font-size:12px;padding:2px 8px;border-radius:var(--radius)">Completed</span>
      <button style="font-size:13px;padding:6px 12px">Book again</button>
    </div>

    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;opacity:0.7">
      <div style="width:44px;height:44px;border-radius:var(--radius);background:var(--surface-1);display:flex;align-items:center;justify-content:center;min-width:44px">
        <i class="ti ti-tennis" style="font-size:20px;color:var(--text-secondary)" aria-hidden="true"></i>
      </div>
      <div style="flex:1">
        <div style="font-weight:500;font-size:14px">Tennis court</div>
        <div style="font-size:13px;color:var(--text-secondary)">Fri 31 Jul, 16:00 – 17:00</div>
      </div>
      <span style="background:var(--bg-danger);color:var(--text-danger);font-size:12px;padding:2px 8px;border-radius:var(--radius)">No-show</span>
      <button style="font-size:13px;padding:6px 12px">Book again</button>
    </div>

  </div>
</div>
