<div style="max-width:680px">
  <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);margin-bottom:1rem">
    <i class="ti ti-home" style="font-size:14px" aria-hidden="true"></i>
    <i class="ti ti-chevron-right" style="font-size:12px" aria-hidden="true"></i>
    <span>Amenities</span>
  </div>

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem">
    <div style="width:32px;height:32px;border-radius:50%;background:var(--bg-accent);display:flex;align-items:center;justify-content:center">
      <i class="ti ti-calendar" style="font-size:16px;color:var(--text-accent)" aria-hidden="true"></i>
    </div>
    <h1 style="margin:0">Amenities</h1>
  </div>

  <div style="display:flex;gap:20px;border-bottom:0.5px solid var(--border);margin-bottom:1.25rem">
    <div style="padding-bottom:8px;font-size:14px;color:var(--text-secondary)">Amenities</div>
    <div style="padding-bottom:8px;font-size:14px;color:var(--text-secondary)">My bookings</div>
    <div style="padding-bottom:8px;border-bottom:2px solid var(--border-accent);font-size:14px;font-weight:500;color:var(--text-accent)">Calendar</div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:1rem;overflow-x:auto;padding-bottom:2px">
    <button style="padding:6px 12px;font-size:13px;border:2px solid var(--border-accent);color:var(--text-accent);font-weight:500;white-space:nowrap;border-radius:14px">All</button>
    <button style="padding:6px 12px;font-size:13px;white-space:nowrap;border-radius:14px;display:flex;align-items:center;gap:6px">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--fill-success);display:inline-block"></span>Tennis court
    </button>
    <button style="padding:6px 12px;font-size:13px;white-space:nowrap;border-radius:14px;display:flex;align-items:center;gap:6px">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--fill-warning);display:inline-block"></span>Pool deck
    </button>
    <button style="padding:6px 12px;font-size:13px;white-space:nowrap;border-radius:14px;display:flex;align-items:center;gap:6px">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--fill-danger);display:inline-block"></span>Braai area
    </button>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <button style="padding:6px 8px" aria-label="Previous month"><i class="ti ti-chevron-left" style="font-size:16px" aria-hidden="true"></i></button>
    <span style="font-weight:500;font-size:15px">August 2026</span>
    <button style="padding:6px 8px" aria-label="Next month"><i class="ti ti-chevron-right" style="font-size:16px" aria-hidden="true"></i></button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:1.5rem;text-align:center">
    <div style="font-size:11px;color:var(--text-muted);padding:4px 0">S</div>
    <div style="font-size:11px;color:var(--text-muted);padding:4px 0">M</div>
    <div style="font-size:11px;color:var(--text-muted);padding:4px 0">T</div>
    <div style="font-size:11px;color:var(--text-muted);padding:4px 0">W</div>
    <div style="font-size:11px;color:var(--text-muted);padding:4px 0">T</div>
    <div style="font-size:11px;color:var(--text-muted);padding:4px 0">F</div>
    <div style="font-size:11px;color:var(--text-muted);padding:4px 0">S</div>

    <div style="padding:6px 0;color:var(--text-disabled);font-size:13px">9</div>
    <div style="padding:6px 0;color:var(--text-disabled);font-size:13px">10</div>
    <div style="padding:6px 0;font-size:13px;position:relative">11
      <div style="display:flex;gap:2px;justify-content:center;margin-top:2px">
        <span style="width:5px;height:5px;border-radius:50%;background:var(--fill-success);display:inline-block"></span>
      </div>
    </div>
    <div style="padding:6px 0;background:var(--fill-primary);color:var(--on-primary);border-radius:8px;font-size:13px;font-weight:500;position:relative">12
      <div style="display:flex;gap:2px;justify-content:center;margin-top:2px">
        <span style="width:5px;height:5px;border-radius:50%;background:var(--on-primary);display:inline-block"></span>
        <span style="width:5px;height:5px;border-radius:50%;background:var(--on-primary);display:inline-block"></span>
      </div>
    </div>
    <div style="padding:6px 0;font-size:13px;position:relative">13
      <div style="display:flex;gap:2px;justify-content:center;margin-top:2px">
        <span style="width:5px;height:5px;border-radius:50%;background:var(--fill-warning);display:inline-block"></span>
      </div>
    </div>
    <div style="padding:6px 0;font-size:13px">14</div>
    <div style="padding:6px 0;font-size:13px;position:relative">15
      <div style="display:flex;gap:2px;justify-content:center;margin-top:2px">
        <span style="width:5px;height:5px;border-radius:50%;background:var(--fill-danger);display:inline-block"></span>
      </div>
    </div>
  </div>

  <p style="font-size:13px;color:var(--text-secondary);margin:0 0 10px">Wed 12 Aug</p>
  <div style="display:flex;flex-direction:column;gap:10px">

    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px">
      <div style="width:44px;text-align:center;font-size:12px;color:var(--text-secondary)">09:00<br/>10:00</div>
      <div style="width:3px;align-self:stretch;background:var(--fill-success);border-radius:2px"></div>
      <div style="flex:1">
        <div style="font-weight:500;font-size:14px">Tennis court</div>
        <div style="font-size:13px;color:var(--text-secondary)">Booked</div>
      </div>
      <span style="background:var(--bg-accent);color:var(--text-accent);font-size:12px;padding:2px 8px;border-radius:var(--radius)">You</span>
    </div>

    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px">
      <div style="width:44px;text-align:center;font-size:12px;color:var(--text-secondary)">12:00<br/>13:00</div>
      <div style="width:3px;align-self:stretch;background:var(--fill-warning);border-radius:2px"></div>
      <div style="flex:1">
        <div style="font-weight:500;font-size:14px">Pool deck</div>
        <div style="font-size:13px;color:var(--text-secondary)">Booked</div>
      </div>
    </div>

    <div style="background:var(--surface-2);border:0.5px dashed var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px">
      <div style="width:44px;text-align:center;font-size:12px;color:var(--text-secondary)">17:00<br/>18:00</div>
      <div style="width:3px;align-self:stretch;background:var(--border);border-radius:2px"></div>
      <div style="flex:1">
        <div style="font-weight:500;font-size:14px">Tennis court</div>
        <div style="font-size:13px;color:var(--text-secondary)">Available</div>
      </div>
      <button style="font-size:13px;padding:6px 12px">Book</button>
    </div>

  </div>
</div>
