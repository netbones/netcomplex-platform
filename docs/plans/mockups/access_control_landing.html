<div style="max-width:680px">
  <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);margin-bottom:1rem">
    <i class="ti ti-home" style="font-size:14px" aria-hidden="true"></i>
    <i class="ti ti-chevron-right" style="font-size:12px" aria-hidden="true"></i>
    <span>Access control</span>
  </div>

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem">
    <div style="width:32px;height:32px;border-radius:50%;background:var(--bg-accent);display:flex;align-items:center;justify-content:center">
      <i class="ti ti-shield-check" style="font-size:16px;color:var(--text-accent)" aria-hidden="true"></i>
    </div>
    <h1 style="margin:0">Access control</h1>
  </div>

  <div style="display:flex;gap:20px;border-bottom:0.5px solid var(--border);margin-bottom:1.25rem">
    <div style="padding-bottom:8px;border-bottom:2px solid var(--border-accent);font-size:14px;font-weight:500;color:var(--text-accent)">Visitors</div>
    <div style="padding-bottom:8px;font-size:14px;color:var(--text-secondary);display:flex;align-items:center;gap:6px">
      Access inbox
      <span style="background:var(--fill-danger);color:var(--on-danger);font-size:11px;min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px">1</span>
    </div>
    <div style="padding-bottom:8px;font-size:14px;color:var(--text-secondary)">History</div>
  </div>

  <div style="display:flex;gap:10px;margin-bottom:14px">
    <button style="flex:1;background:var(--fill-primary);color:var(--on-primary);border:none;padding:10px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px">
      <i class="ti ti-user-plus" style="font-size:16px" aria-hidden="true"></i>Add new visitor
    </button>
    <button style="flex:1;padding:10px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px">
      <i class="ti ti-qrcode" style="font-size:16px" aria-hidden="true"></i>Quick access code
    </button>
  </div>

  <input type="text" placeholder="Search visitors" style="width:100%;margin-bottom:16px" />

  <p style="font-size:13px;color:var(--text-secondary);margin:0 0 10px">Upcoming and active</p>
  <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem">

    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--bg-success);display:flex;align-items:center;justify-content:center;min-width:40px">
        <i class="ti ti-walk" style="font-size:18px;color:var(--text-success)" aria-hidden="true"></i>
      </div>
      <div style="flex:1">
        <div style="font-weight:500;font-size:14px">Joyce Mphe</div>
        <div style="font-size:13px;color:var(--text-secondary)">060 235 8963 · Walk-in visitor</div>
      </div>
      <span style="background:var(--bg-success);color:var(--text-success);font-size:12px;padding:2px 8px;border-radius:var(--radius)">Active</span>
      <button style="font-size:13px;padding:6px 10px" aria-label="Edit visitor"><i class="ti ti-edit" style="font-size:14px" aria-hidden="true"></i></button>
    </div>

    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--bg-accent);display:flex;align-items:center;justify-content:center;min-width:40px">
        <i class="ti ti-car" style="font-size:18px;color:var(--text-accent)" aria-hidden="true"></i>
      </div>
      <div style="flex:1">
        <div style="font-weight:500;font-size:14px">Sally Seitle</div>
        <div style="font-size:13px;color:var(--text-secondary)">HY 789 GP · Vehicle · expires 6:00 PM</div>
      </div>
      <span style="background:var(--bg-warning);color:var(--text-warning);font-size:12px;padding:2px 8px;border-radius:var(--radius)">Pending</span>
      <button style="font-size:13px;padding:6px 10px" aria-label="Edit visitor"><i class="ti ti-edit" style="font-size:14px" aria-hidden="true"></i></button>
    </div>

  </div>

  <div style="text-align:center;padding-top:0.5rem;border-top:0.5px solid var(--border)">
    <a href="#" style="font-size:13px">Important notice to all residents</a>
  </div>
</div>
