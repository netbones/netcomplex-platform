<div style="max-width:420px;margin:0 auto">
  <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;overflow:hidden">

    <div style="padding:16px;text-align:center;border-bottom:0.5px solid var(--border)">
      <p style="font-size:14px;color:var(--text-secondary);margin:0">Visitor requesting access at</p>
      <p style="font-size:16px;font-weight:500;margin:2px 0 0">Oakwood Estate — Main gate</p>
    </div>

    <div style="padding:20px;display:flex;flex-direction:column;align-items:center">
      <div style="width:80px;height:80px;border-radius:50%;background:var(--bg-accent);display:flex;align-items:center;justify-content:center;margin-bottom:12px">
        <i class="ti ti-user" style="font-size:36px;color:var(--text-accent)" aria-hidden="true"></i>
      </div>
      <p style="font-weight:500;font-size:16px;margin:0">Steve Richmore</p>
      <p style="font-size:13px;color:var(--text-secondary);margin:2px 0 0">Uber driver · CA 54321</p>

      <div style="display:flex;align-items:center;gap:6px;margin-top:16px;color:var(--text-warning)">
        <i class="ti ti-clock" style="font-size:16px" aria-hidden="true"></i>
        <span style="font-size:13px;font-weight:500">Expires in 0:03</span>
      </div>
    </div>

    <div style="background:var(--bg-warning);padding:10px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px">
      <i class="ti ti-alert-circle" style="font-size:16px;color:var(--text-warning)" aria-hidden="true"></i>
      <span style="font-size:13px;font-weight:500;color:var(--text-warning)">Action required</span>
    </div>

    <div style="display:flex;gap:10px;padding:16px">
      <button style="flex:1;background:var(--fill-danger);color:var(--on-danger);border:none;padding:10px;font-size:14px;font-weight:500">Deny</button>
      <button style="flex:1;background:var(--fill-success,var(--fill-primary));color:var(--on-success,var(--on-primary));border:none;padding:10px;font-size:14px;font-weight:500">Allow</button>
    </div>
  </div>
</div>
