<div style="max-width:520px">
  <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);margin-bottom:1rem">
    <i class="ti ti-arrow-left" style="font-size:14px" aria-hidden="true"></i>
    <span>Back to amenities</span>
  </div>

  <h1 style="margin:0 0 1.25rem">Edit amenity</h1>

  <div style="display:flex;flex-direction:column;gap:14px">

    <div>
      <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Name</label>
      <input type="text" value="Tennis court" style="width:100%" />
    </div>

    <div style="display:flex;gap:12px">
      <div style="flex:1">
        <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Icon</label>
        <select style="width:100%"><option>Tennis</option><option>Swimming</option><option>Parking</option><option>Fire</option><option>Gym</option></select>
      </div>
      <div style="flex:1">
        <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Photo (optional)</label>
        <button style="width:100%;padding:9px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px">
          <i class="ti ti-upload" style="font-size:14px" aria-hidden="true"></i>Upload
        </button>
      </div>
    </div>

    <div style="display:flex;gap:12px">
      <div style="flex:1">
        <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Opens</label>
        <input type="time" value="06:00" style="width:100%" />
      </div>
      <div style="flex:1">
        <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Closes</label>
        <input type="time" value="21:30" style="width:100%" />
      </div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);margin-top:-8px">
      <input type="checkbox" style="margin:0" />Always open (no hours restriction)
    </label>

    <label style="display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:10px 12px;background:var(--surface-1);border-radius:var(--radius)">
      Bookable
      <input type="checkbox" checked style="margin:0" />
    </label>

    <div style="display:flex;gap:12px">
      <div style="flex:1">
        <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Slot duration (mins)</label>
        <input type="number" value="60" style="width:100%" />
      </div>
      <div style="flex:1">
        <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Max occupancy</label>
        <input type="number" value="4" style="width:100%" />
      </div>
    </div>

    <label style="display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:10px 12px;background:var(--surface-1);border-radius:var(--radius)">
      Allow waitlist when fully booked
      <input type="checkbox" checked style="margin:0" />
    </label>

    <div>
      <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Rules and info (shown to residents)</label>
      <textarea rows="3" style="width:100%">Bring your own racket and balls. Court shoes required.</textarea>
    </div>

    <label style="display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:10px 12px;background:var(--surface-1);border-radius:var(--radius)">
      Active (visible to residents)
      <input type="checkbox" checked style="margin:0" />
    </label>

    <div style="display:flex;gap:10px;margin-top:6px">
      <button style="padding:10px 14px;font-size:14px;color:var(--text-danger);border-color:var(--border-danger)">Deactivate</button>
      <div style="flex:1"></div>
      <button style="padding:10px 16px;font-size:14px">Cancel</button>
      <button style="padding:10px 16px;font-size:14px;font-weight:500;background:var(--fill-primary);color:var(--on-primary);border:none">Save changes</button>
    </div>

  </div>
</div>
