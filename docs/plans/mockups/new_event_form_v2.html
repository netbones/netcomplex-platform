<div style="max-width:640px">
  <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);margin-bottom:1rem">
    <i class="ti ti-home" style="font-size:14px" aria-hidden="true"></i>
    <i class="ti ti-chevron-right" style="font-size:12px" aria-hidden="true"></i>
    <span>Events</span>
    <i class="ti ti-chevron-right" style="font-size:12px" aria-hidden="true"></i>
    <span>New event</span>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem">
    <h1 style="margin:0">New event</h1>
    <button style="padding:8px 12px;font-size:13px;display:flex;align-items:center;gap:6px">
      <i class="ti ti-arrow-left" style="font-size:14px" aria-hidden="true"></i>Back to events
    </button>
  </div>

  <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:1rem">
    <p style="font-size:13px;font-weight:500;color:var(--text-secondary);margin:0 0 12px;text-transform:uppercase;letter-spacing:0.02em">Details</p>

    <div style="margin-bottom:14px">
      <label style="font-size:13px;display:block;margin-bottom:6px">Title <span style="color:var(--text-danger)">*</span></label>
      <input type="text" placeholder="Event title" style="width:100%" />
    </div>

    <div style="margin-bottom:14px">
      <label style="font-size:13px;display:block;margin-bottom:6px">Description <span style="color:var(--text-danger)">*</span></label>
      <textarea rows="3" placeholder="What's happening, and why residents should come" style="width:100%"></textarea>
    </div>

    <div style="display:flex;gap:12px">
      <div style="flex:1">
        <label style="font-size:13px;display:block;margin-bottom:6px">Category</label>
        <select style="width:100%"><option>Social</option><option>Meeting</option><option>Sport</option><option>Community project</option><option>Other</option></select>
      </div>
      <div style="flex:1">
        <label style="font-size:13px;display:block;margin-bottom:6px">Cover image</label>
        <button style="width:100%;padding:9px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px">
          <i class="ti ti-photo-plus" style="font-size:14px" aria-hidden="true"></i>Upload image
        </button>
      </div>
    </div>
  </div>

  <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:1rem">
    <p style="font-size:13px;font-weight:500;color:var(--text-secondary);margin:0 0 12px;text-transform:uppercase;letter-spacing:0.02em">When &amp; where</p>

    <div style="display:flex;gap:12px;margin-bottom:14px">
      <div style="flex:1">
        <label style="font-size:13px;display:block;margin-bottom:6px">Date <span style="color:var(--text-danger)">*</span></label>
        <input type="date" style="width:100%" />
      </div>
      <div style="flex:1">
        <label style="font-size:13px;display:block;margin-bottom:6px">Start time <span style="color:var(--text-danger)">*</span></label>
        <input type="time" style="width:100%" />
      </div>
      <div style="flex:1">
        <label style="font-size:13px;display:block;margin-bottom:6px">End time</label>
        <input type="time" style="width:100%" />
      </div>
    </div>

    <div>
      <label style="font-size:13px;display:block;margin-bottom:6px">Location <span style="color:var(--text-danger)">*</span></label>
      <input type="text" placeholder="e.g. Clubhouse lawn" style="width:100%" />
    </div>
  </div>

  <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:1rem">
    <p style="font-size:13px;font-weight:500;color:var(--text-secondary);margin:0 0 12px;text-transform:uppercase;letter-spacing:0.02em">Organizer &amp; RSVPs</p>

    <div style="display:flex;gap:12px;margin-bottom:14px">
      <div style="flex:1">
        <label style="font-size:13px;display:block;margin-bottom:6px">Organizer <span style="color:var(--text-danger)">*</span></label>
        <input type="text" placeholder="e.g. Community Committee" style="width:100%" />
      </div>
      <div style="flex:1">
        <label style="font-size:13px;display:block;margin-bottom:6px">Capacity (optional)</label>
        <input type="number" placeholder="Unlimited" style="width:100%" />
      </div>
    </div>

    <label style="display:flex;align-items:center;gap:8px;font-size:14px">
      <input type="checkbox" checked style="margin:0" />Allow residents to RSVP
    </label>
  </div>

  <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:1.25rem">
    <p style="font-size:13px;font-weight:500;color:var(--text-secondary);margin:0 0 12px;text-transform:uppercase;letter-spacing:0.02em">Visibility</p>

    <label style="display:flex;align-items:center;gap:10px;border:2px solid var(--border-accent);border-radius:var(--radius);padding:10px 12px;font-size:14px;margin-bottom:8px;cursor:pointer">
      <input type="radio" name="vis" checked style="margin:0" />
      <div>
        <div style="font-weight:500">Residents only</div>
        <div style="font-size:12px;color:var(--text-secondary)">Visible only inside the community app</div>
      </div>
    </label>
    <label style="display:flex;align-items:center;gap:10px;border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:14px;cursor:pointer">
      <input type="radio" name="vis" style="margin:0" />
      <div>
        <div style="font-weight:500">Public event</div>
        <div style="font-size:12px;color:var(--text-secondary)">Also shown on the tenant's public events page, if enabled</div>
      </div>
    </label>
  </div>

  <div style="display:flex;gap:10px;justify-content:flex-end">
    <button style="padding:10px 16px;font-size:14px">Save as draft</button>
    <button style="padding:10px 16px;font-size:14px">Cancel</button>
    <button style="padding:10px 18px;font-size:14px;font-weight:500;background:var(--fill-primary);color:var(--on-primary);border:none">Create event</button>
  </div>
</div>
