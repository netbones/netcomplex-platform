<div style="max-width:680px">
  <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);margin-bottom:1rem">
    <i class="ti ti-arrow-left" style="font-size:14px" aria-hidden="true"></i>
    <span>Back to amenities</span>
  </div>

  <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;overflow:hidden">

    <div style="height:140px;background:var(--bg-success);display:flex;align-items:center;justify-content:center">
      <i class="ti ti-tennis" style="font-size:48px;color:var(--text-success)" aria-hidden="true"></i>
    </div>

    <div style="padding:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <h2 style="margin:0">Tennis court</h2>
        <span style="background:var(--bg-success);color:var(--text-success);font-size:12px;padding:2px 8px;border-radius:var(--radius)">Open</span>
      </div>
      <div style="font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:5px;margin-bottom:2px">
        <i class="ti ti-clock" style="font-size:14px" aria-hidden="true"></i>06:00 – 21:30 daily
      </div>
      <div style="font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:5px">
        <i class="ti ti-users" style="font-size:14px" aria-hidden="true"></i>Max 4 people · 1 hour slots
      </div>

      <div style="border-top:0.5px solid var(--border);margin:14px 0"></div>

      <p style="font-size:13px;color:var(--text-secondary);margin:0 0 10px">Select a date</p>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <button style="flex:1;padding:8px 4px;font-size:13px;border:2px solid var(--border-accent);color:var(--text-accent);font-weight:500">
          <div>Wed</div><div style="font-size:15px">12</div>
        </button>
        <button style="flex:1;padding:8px 4px;font-size:13px">
          <div>Thu</div><div style="font-size:15px">13</div>
        </button>
        <button style="flex:1;padding:8px 4px;font-size:13px">
          <div>Fri</div><div style="font-size:15px">14</div>
        </button>
        <button style="flex:1;padding:8px 4px;font-size:13px">
          <div>Sat</div><div style="font-size:15px">15</div>
        </button>
        <button style="flex:1;padding:8px 4px;font-size:13px">
          <div>Sun</div><div style="font-size:15px">16</div>
        </button>
      </div>

      <p style="font-size:13px;color:var(--text-secondary);margin:0 0 10px">Select a time slot</p>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px">
        <button style="padding:8px;font-size:13px;color:var(--text-disabled)" disabled>06:00</button>
        <button style="padding:8px;font-size:13px;color:var(--text-disabled)" disabled>07:00</button>
        <button style="padding:8px;font-size:13px">08:00</button>
        <button style="padding:8px;font-size:13px;border:2px solid var(--border-accent);color:var(--text-accent);font-weight:500">09:00</button>
        <button style="padding:8px;font-size:13px">10:00</button>
        <button style="padding:8px;font-size:13px">11:00</button>
      </div>

      <div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 12px;font-size:13px;color:var(--text-secondary);margin-bottom:16px">
        <i class="ti ti-info-circle" style="font-size:14px;vertical-align:-2px;margin-right:6px" aria-hidden="true"></i>
        Bring your own racket and balls. Court shoes required.
      </div>

      <button style="width:100%;background:var(--fill-primary);color:var(--on-primary);border:none;padding:10px;font-size:14px;font-weight:500">
        Confirm booking · Wed 12, 09:00
      </button>
    </div>
  </div>
</div>
