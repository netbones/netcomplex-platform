<div style="width:100%">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:10px">
    <h1 style="margin:0">Amenities</h1>
    <button style="padding:8px 12px;font-size:13px;display:flex;align-items:center;gap:6px;background:var(--fill-primary);color:var(--on-primary);border:none">
      <i class="ti ti-plus" style="font-size:15px" aria-hidden="true"></i>Add amenity
    </button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:1.25rem">
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem">
      <div style="font-size:13px;color:var(--text-secondary)">Active amenities</div>
      <div style="font-size:24px;font-weight:500">6</div>
    </div>
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem">
      <div style="font-size:13px;color:var(--text-secondary)">Bookings today</div>
      <div style="font-size:24px;font-weight:500">14</div>
    </div>
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem">
      <div style="font-size:13px;color:var(--text-secondary)">On waitlist</div>
      <div style="font-size:24px;font-weight:500">2</div>
    </div>
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem">
      <div style="font-size:13px;color:var(--text-secondary)">No-shows this week</div>
      <div style="font-size:24px;font-weight:500">3</div>
    </div>
  </div>

  <input type="text" placeholder="Search amenities" style="width:100%;margin-bottom:1rem" />

  <table style="width:100%;border-collapse:collapse;font-size:13px">
    <thead>
      <tr style="border-bottom:0.5px solid var(--border)">
        <th style="text-align:left;padding:8px 6px;color:var(--text-secondary);font-weight:500;width:24px"></th>
        <th style="text-align:left;padding:8px 6px;color:var(--text-secondary);font-weight:500">Amenity</th>
        <th style="text-align:left;padding:8px 6px;color:var(--text-secondary);font-weight:500">Hours</th>
        <th style="text-align:left;padding:8px 6px;color:var(--text-secondary);font-weight:500">Bookable</th>
        <th style="text-align:left;padding:8px 6px;color:var(--text-secondary);font-weight:500">Bookings today</th>
        <th style="text-align:left;padding:8px 6px;color:var(--text-secondary);font-weight:500">Status</th>
        <th style="padding:8px 6px"></th>
      </tr>
    </thead>
    <tbody>
      <tr style="border-bottom:0.5px solid var(--border)">
        <td style="padding:10px 6px;color:var(--text-muted)"><i class="ti ti-grip-vertical" style="font-size:14px" aria-hidden="true"></i></td>
        <td style="padding:10px 6px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:30px;height:30px;border-radius:8px;background:var(--bg-success);display:flex;align-items:center;justify-content:center;min-width:30px">
              <i class="ti ti-tennis" style="font-size:15px;color:var(--text-success)" aria-hidden="true"></i>
            </div>
            <span style="font-weight:500">Tennis court</span>
          </div>
        </td>
        <td style="padding:10px 6px;color:var(--text-secondary)">06:00 – 21:30</td>
        <td style="padding:10px 6px"><i class="ti ti-check" style="font-size:16px;color:var(--text-success)" aria-hidden="true"></i></td>
        <td style="padding:10px 6px;color:var(--text-secondary)">5</td>
        <td style="padding:10px 6px"><span style="background:var(--bg-success);color:var(--text-success);padding:2px 8px;border-radius:var(--radius)">Active</span></td>
        <td style="padding:10px 6px;text-align:right"><i class="ti ti-dots" style="font-size:16px;color:var(--text-muted)" aria-hidden="true"></i></td>
      </tr>
      <tr style="border-bottom:0.5px solid var(--border)">
        <td style="padding:10px 6px;color:var(--text-muted)"><i class="ti ti-grip-vertical" style="font-size:14px" aria-hidden="true"></i></td>
        <td style="padding:10px 6px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:30px;height:30px;border-radius:8px;background:var(--bg-warning);display:flex;align-items:center;justify-content:center;min-width:30px">
              <i class="ti ti-swimming" style="font-size:15px;color:var(--text-warning)" aria-hidden="true"></i>
            </div>
            <span style="font-weight:500">Pool deck</span>
          </div>
        </td>
        <td style="padding:10px 6px;color:var(--text-secondary)">08:00 – 18:00</td>
        <td style="padding:10px 6px"><i class="ti ti-check" style="font-size:16px;color:var(--text-success)" aria-hidden="true"></i></td>
        <td style="padding:10px 6px;color:var(--text-secondary)">6</td>
        <td style="padding:10px 6px"><span style="background:var(--bg-success);color:var(--text-success);padding:2px 8px;border-radius:var(--radius)">Active</span></td>
        <td style="padding:10px 6px;text-align:right"><i class="ti ti-dots" style="font-size:16px;color:var(--text-muted)" aria-hidden="true"></i></td>
      </tr>
      <tr style="border-bottom:0.5px solid var(--border)">
        <td style="padding:10px 6px;color:var(--text-muted)"><i class="ti ti-grip-vertical" style="font-size:14px" aria-hidden="true"></i></td>
        <td style="padding:10px 6px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:30px;height:30px;border-radius:8px;background:var(--surface-1);display:flex;align-items:center;justify-content:center;min-width:30px">
              <i class="ti ti-parking" style="font-size:15px;color:var(--text-secondary)" aria-hidden="true"></i>
            </div>
            <span style="font-weight:500">Visitor parking</span>
          </div>
        </td>
        <td style="padding:10px 6px;color:var(--text-secondary)">Always open</td>
        <td style="padding:10px 6px"><i class="ti ti-x" style="font-size:16px;color:var(--text-muted)" aria-hidden="true"></i></td>
        <td style="padding:10px 6px;color:var(--text-secondary)">—</td>
        <td style="padding:10px 6px"><span style="background:var(--bg-success);color:var(--text-success);padding:2px 8px;border-radius:var(--radius)">Active</span></td>
        <td style="padding:10px 6px;text-align:right"><i class="ti ti-dots" style="font-size:16px;color:var(--text-muted)" aria-hidden="true"></i></td>
      </tr>
      <tr>
        <td style="padding:10px 6px;color:var(--text-muted)"><i class="ti ti-grip-vertical" style="font-size:14px" aria-hidden="true"></i></td>
        <td style="padding:10px 6px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:30px;height:30px;border-radius:8px;background:var(--bg-danger);display:flex;align-items:center;justify-content:center;min-width:30px">
              <i class="ti ti-fire" style="font-size:15px;color:var(--text-danger)" aria-hidden="true"></i>
            </div>
            <span style="font-weight:500">Braai area</span>
          </div>
        </td>
        <td style="padding:10px 6px;color:var(--text-secondary)">10:00 – 22:00</td>
        <td style="padding:10px 6px"><i class="ti ti-check" style="font-size:16px;color:var(--text-success)" aria-hidden="true"></i></td>
        <td style="padding:10px 6px;color:var(--text-secondary)">3</td>
        <td style="padding:10px 6px"><span style="background:var(--surface-1);color:var(--text-secondary);padding:2px 8px;border-radius:var(--radius)">Inactive</span></td>
        <td style="padding:10px 6px;text-align:right"><i class="ti ti-dots" style="font-size:16px;color:var(--text-muted)" aria-hidden="true"></i></td>
      </tr>
    </tbody>
  </table>
</div>
