<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Directory - Soralia Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'soralia-primary': '#4F46E5',
                        'soralia-secondary': '#7C3AED',
                        'soralia-accent': '#F59E0B',
                        'soralia-light': '#F8FAFC',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-soralia-light">
    <!-- Header will be loaded by header.js -->

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">Community Directory</h1>
            <p class="text-xl text-gray-600">Connect with your neighbors and community leaders</p>
        </div>

        <!-- Search and Filters -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <div class="flex flex-col lg:flex-row gap-4 mb-6">
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" placeholder="Search by name, address, or interests..." 
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-soralia-primary">
                    <i class="fas fa-search absolute left-3 top-4 text-gray-400"></i>
                </div>
                <button onclick="searchDirectory()" class="bg-soralia-primary text-white py-3 px-6 rounded-lg hover:bg-soralia-secondary transition-colors">
                    <i class="fas fa-search mr-2"></i>Search
                </button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Filter by Role</label>
                    <select id="roleFilter" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-soralia-primary">
                        <option value="">All Residents</option>
                        <option value="board">Board Members</option>
                        <option value="committee">Committee Members</option>
                        <option value="owner">Property Owners</option>
                        <option value="tenant">Tenants</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Street</label>
                    <select id="streetFilter" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-soralia-primary">
                        <option value="">All Streets</option>
                        <option value="pagoda">Pagoda Rd</option>
                        <option value="wild-almond">Wild Almond Rd</option>
                        <option value="silkypuff">Silkypuff Street</option>
                        <option value="beechwood">Beechwood Rd</option>
                        <option value="sugarbrush">Sugarbrush Rd</option>
                        <option value="conebrush">Conebrush Rd</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Interests</label>
                    <select id="interestFilter" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-soralia-primary">
                        <option value="">All Interests</option>
                        <option value="gardening">Gardening</option>
                        <option value="fitness">Fitness</option>
                        <option value="book-club">Book Club</option>
                        <option value="cooking">Cooking</option>
                        <option value="photography">Photography</option>
                        <option value="volunteering">Volunteering</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Sort by</label>
                    <select id="sortFilter" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-soralia-primary">
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="street">Street</option>
                        <option value="unit">Unit Number</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- View Toggle -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center space-x-4">
                <span class="text-gray-700 font-medium">View:</span>
                <div class="flex bg-gray-100 rounded-lg p-1">
                    <button id="gridViewBtn" onclick="switchView('grid')" class="px-4 py-2 rounded-md bg-soralia-primary text-white transition-colors">
                        <i class="fas fa-th-large mr-2"></i>Grid
                    </button>
                    <button id="listViewBtn" onclick="switchView('list')" class="px-4 py-2 rounded-md text-gray-600 hover:text-gray-800 transition-colors">
                        <i class="fas fa-list mr-2"></i>List
                    </button>
                </div>
            </div>
            <div class="text-gray-600">
                <span id="resultCount">Showing 24 residents</span>
            </div>
        </div>

        <!-- Directory Results -->
        <div id="directoryResults">
            <!-- Grid View -->
            <div id="gridView" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Resident Cards will be populated by JavaScript -->
            </div>

            <!-- List View -->
            <div id="listView" class="hidden space-y-4">
                <!-- List items will be populated by JavaScript -->
            </div>
        </div>

        <!-- Pagination -->
        <div class="flex justify-center mt-8">
            <nav class="flex items-center space-x-2">
                <button class="px-3 py-2 text-gray-500 hover:text-gray-700 disabled:opacity-50" disabled>
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="px-3 py-2 bg-soralia-primary text-white rounded-md">1</button>
                <button class="px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-md">2</button>
                <button class="px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-md">3</button>
                <button class="px-3 py-2 text-gray-700 hover:text-gray-900">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </nav>
        </div>
    </div>

    <!-- Chat Modal -->
    <div id="contactModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-900">Chat with Resident</h3>
                <button onclick="closeChatModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="contactModalContent">
                <!-- Chat interface will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/directory.js"></script>
</body>
</html>
