<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Standardized panel background card glow -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <!-- High-energy pink-to-magenta gradient for outer concentric impact rings -->
    <linearGradient id="campaignPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="60%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <!-- Cyan/Indigo palette for the directional launch arrow -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <!-- Drop shadow filter for consistent depth -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#831843" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <!-- Campaign target graphics group -->
  <g filter="url(#dropShadow)" transform="translate(32, 34)">
    <!-- Outer Marketing Impact Ring -->
    <circle cx="0" cy="0" r="14" fill="url(#campaignPrimary)" />
    <!-- Middle Strategy Ring Layer -->
    <circle cx="0" cy="0" r="9" fill="#F3F1FB" opacity="0.9" />
    <!-- Bulls-Eye Core -->
    <circle cx="0" cy="0" r="5" fill="url(#campaignPrimary)" />
    
    <!-- Dynamic Launch Arrow striking top right -->
    <g transform="rotate(-45 0 0) translate(0, -2)">
      <!-- Arrow Shaft -->
      <rect x="-1.5" y="4" width="3" height="18" rx="1" fill="url(#arrowGrad)" />
      <!-- Arrow Head -->
      <path d="M-4,4 L0,-3 L4,4 Z" fill="#38BDF8" />
      <!-- Fletching/Feather lines -->
      <path d="M-3,20 L-5,23 M3,20 L5,23" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
