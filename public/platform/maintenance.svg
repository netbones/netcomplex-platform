<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Soft background glow layer -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Deep metallic purple/blue gradient for the main wrench body -->
    <linearGradient id="wrenchPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B86E3" />
      <stop offset="40%" stop-color="#5B53CD" />
      <stop offset="100%" stop-color="#35299B" />
    </linearGradient>
    <!-- Highlight overlay for the pseudo-3D sheen -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Drop shadow filter for depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#35299B" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Icon Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />
  
  <!-- Wrench Group with Shadow -->
  <g filter="url(#dropShadow)" transform="rotate(-45 32 32)">
    <!-- Main Wrench Shape -->
    <path d="M44,24 C44,17.37 38.63,12 32,12 C27.58,12 23.77,14.39 21.75,17.94 L27,23.19 C28,22.19 29.5,21.5 31,21.5 C34.04,21.5 36.5,23.96 36.5,27 C36.5,28.5 35.81,30 34.81,31 L40.06,36.25 C42.41,33.56 44,29.97 44,24 Z" fill="url(#wrenchPrimary)"/>
    <!-- Handle -->
    <rect x="28" y="30" width="8" height="22" rx="4" fill="url(#wrenchPrimary)" />
    <!-- 3D Sheen Layer -->
    <path d="M44,24 C44,17.37 38.63,12 32,12 C27.58,12 23.77,14.39 21.75,17.94 L27,23.19 C28,22.19 29.5,21.5 31,21.5 C34.04,21.5 36.5,23.96 36.5,27 C36.5,28.5 35.81,30 34.81,31 L40.06,36.25 C42.41,33.56 44,29.97 44,24 Z" fill="url(#sheen)"/>
    <rect x="28" y="30" width="4" height="22" fill="url(#sheen)" />
  </g>
</svg>
