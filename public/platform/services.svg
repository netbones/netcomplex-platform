<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Standardized panel background card glow -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Deep violet-to-indigo structure gradient -->
    <linearGradient id="hoaPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <!-- Vibrant cyan security accent for the gate bar and entry signal -->
    <linearGradient id="hoaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <!-- Drop shadow filter for consistent panel depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#4C1D95" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <!-- HOA Estate Graphics Group -->
  <g filter="url(#dropShadow)" transform="translate(13, 15)">
    <!-- Entrance Archway / Pillars representing structural estate management -->
    <path d="M2,30 V12 C2,6 8,4 19,4 C30,4 36,6 36,12 V30" fill="none" stroke="url(#hoaPrimary)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Secure Boundary Wall Baselines -->
    <rect x="0" y="24" width="6" height="6" rx="1" fill="url(#hoaPrimary)" />
    <rect x="32" y="24" width="6" height="6" rx="1" fill="url(#hoaPrimary)" />

    <!-- Protected Community Home Silhouette inside the Arch -->
    <path d="M12,20 L19,14 L26,20 V26 H12 Z" fill="url(#hoaPrimary)" opacity="0.4" />

    <!-- Active Security Boom Gate Bar (Horizontal/Protected State) -->
    <rect x="4" y="20" width="30" height="3" rx="1.5" fill="url(#hoaAccent)" />
    
    <!-- Structural Detailing Joints -->
    <circle cx="31" cy="21.5" r="2" fill="#FFFFFF" />
    <line x1="8" y1="21.5" x2="26" y2="21.5" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2,2" opacity="0.8" />
  </g>
</svg>
