<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="netComplexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F9F7F1" />
    </linearGradient>
    
    <linearGradient id="netComplexNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <linearGradient id="netComplexGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    
    <filter id="netComplexShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Container Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#netComplexBg)" stroke="#E2E8F0" stroke-width="1" />

  <!-- Wallet Graphic Group -->
  <g filter="url(#netComplexShadow)" transform="translate(14, 16)">
    <!-- Peeking Token/Card Layer using Premium Tenant Gold -->
    <path d="M6,2 C6,0.9 6.9,0 8,0 H26 C27.1,0 28,0.9 28,2 V10 H6 Z" fill="url(#netComplexGold)" />
    <line x1="10" y1="4" x2="18" y2="4" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

    <!-- Main Wallet Back Shell in Corporate Navy -->
    <rect x="0" y="6" width="34" height="24" rx="5" fill="url(#netComplexNavy)" />
    
    <!-- Front Flap / Overlapping Layer -->
    <path d="M0,10 C0,7.8 1.8,6 4,6 H30 C32.2,6 34,7.8 34,10 V26 C34,28.2 32.2,30 30,30 H4 C1.8,30 0,28.2 0,26 Z" fill="url(#netComplexNavy)" />

    <!-- Clasp Detailing -->
    <path d="M22,14 H34 V22 H22 C19.8,22 18,20.2 18,18 C18,15.8 19.8,14 22,14 Z" fill="#020617" opacity="0.4" />
    <circle cx="24" cy="18" r="2.5" fill="#FFFFFF" />
    <circle cx="24" cy="18" r="1" fill="url(#netComplexGold)" />
  </g>
</svg>
