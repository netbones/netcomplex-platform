<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gearBig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="gearSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#4338CA" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <g filter="url(#dropShadow)">
    <!-- Large Master Gear -->
    <g transform="translate(26, 26)">
      <circle cx="0" cy="0" r="12" fill="url(#gearBig)" />
      <!-- Inner Cutout hole -->
      <circle cx="0" cy="0" r="4" fill="#E8ECFD" />
      <!-- Teeth Simplifications -->
      <path d="M-2,-15 H2 L3,-12 H-3 Z" fill="url(#gearBig)" />
      <path d="M-2,12 H2 L3,15 H-3 Z" fill="url(#gearBig)" />
      <path d="M-15,-2 V2 L-12,3 V-3 Z" fill="url(#gearBig)" />
      <path d="M12,-2 V2 L15,3 V-3 Z" fill="url(#gearBig)" />
    </g>

    <!-- Secondary Interlocking Gear -->
    <g transform="translate(42, 42)">
      <circle cx="0" cy="0" r="8" fill="url(#gearSmall)" />
      <circle cx="0" cy="0" r="2.5" fill="#F3F1FB" />
      <!-- Teeth Simplifications -->
      <path d="M-1.5,-10 H1.5 L2,-8 H-2 Z" fill="url(#gearSmall)" />
      <path d="M-1.5,8 H1.5 L2,10 H-2 Z" fill="url(#gearSmall)" />
      <path d="M-10,-1.5 V1.5 L-8,2 V-2 Z" fill="url(#gearSmall)" />
      <path d="M8,-1.5 V1.5 L10,2 V-2 Z" fill="url(#gearSmall)" />
    </g>
  </g>
</svg>
