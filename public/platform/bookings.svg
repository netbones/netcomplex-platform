<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="calBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAC9F9" />
      <stop offset="60%" stop-color="#809BF6" />
      <stop offset="100%" stop-color="#4D6FE2" />
    </linearGradient>
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B6FE9" />
      <stop offset="100%" stop-color="#503FD4" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#4D6FE2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <!-- Calendar Base -->
  <g filter="url(#subtleShadow)">
    <rect x="14" y="16" width="36" height="34" rx="6" fill="url(#calBody)" />
    <!-- Top Header Bar -->
    <path d="M14,22 C14,18.68 16.68,16 20,16 L44,16 C47.32,16 50,18.68 50,22 L50,26 L14,26 Z" fill="url(#calHeader)" />
    
    <!-- Rings/Binder holes -->
    <rect x="22" y="12" width="4" height="8" rx="2" fill="#7B6FE9" />
    <rect x="38" y="12" width="4" height="8" rx="2" fill="#7B6FE9" />

    <!-- "31" Text stylized -->
    <text x="32" y="44" font-family="system-ui, sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF" text-anchor="middle">31</text>
  </g>
</svg>
