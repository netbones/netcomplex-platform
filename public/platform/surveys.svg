  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <g filter="url(#dropShadow)" transform="translate(17, 13)">
    <rect x="0" y="4" width="30" height="38" rx="5" fill="url(#surveyGrad)" />
    <rect x="9" y="0" width="12" height="6" rx="2" fill="#34D399" />
    
    <line x1="6" y1="14" x2="24" y2="14" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="6" y1="22" x2="20" y2="22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="6" y1="30" x2="24" y2="30" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
