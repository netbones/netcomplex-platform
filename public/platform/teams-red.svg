<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Standardized panel background card glow -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Premium red-to-magenta primary gradient for the main foreground user -->
    <linearGradient id="teamPrimaryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <!-- High-visibility secondary rose/coral accent for background supporting crew members -->
    <linearGradient id="teamAccentRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <!-- Drop shadow filter tuned to match the deep red/crimson undertones -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#831843" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <!-- Teams Graphics Group -->
  <g filter="url(#dropShadow)" transform="translate(11, 14)">
    <!-- Background Crew Member Left -->
    <g opacity="0.65" transform="translate(0, 2)">
      <circle cx="10" cy="6" r="4.5" fill="url(#teamAccentRed)" />
      <path d="M2,16.5 C2,13 5.5,12 10,12 C14.5,12 18,13 18,16.5 V21 H2 Z" fill="url(#teamAccentRed)" />
    </g>

    <!-- Background Crew Member Right (Offset) -->
    <g opacity="0.65" transform="translate(22, 2)">
      <circle cx="10" cy="6" r="4.5" fill="url(#teamAccentRed)" />
      <path d="M2,16.5 C2,13 5.5,12 10,12 C14.5,12 18,13 18,16.5 V21 H2 Z" fill="url(#teamAccentRed)" />
    </g>

    <!-- Foreground Lead / Dispatch Profile (Centered & Scaled) -->
    <g transform="translate(9, 5)">
      <!-- True alpha background spacer cutouts can be handled visually via overlapping layers -->
      <circle cx="12" cy="7" r="5.5" fill="url(#teamPrimaryRed)" />
      <!-- Sharp profile contours for the crew vest look -->
      <path d="M2,20 C2,15.5 6.5,14 12,14 C17.5,14 22,15.5 22,20 V25 H2 Z" fill="url(#teamPrimaryRed)" />
      <!-- Minimalist indicator badge on lead worker chest -->
      <circle cx="12" cy="18" r="1.5" fill="#FFFFFF" opacity="0.9" />
    </g>
  </g>
</svg>
