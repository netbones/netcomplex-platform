<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Standardized panel background card glow -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Premium red-to-magenta primary gradient for the academic cap and portal pages -->
    <linearGradient id="eduPrimaryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <!-- High-visibility secondary rose accent for the tassel and portal highlights -->
    <linearGradient id="eduAccentRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <!-- Drop shadow filter tuned to match the deep red/crimson undertones -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#831843" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <!-- Education Graphic Elements Group -->
  <g filter="url(#dropShadow)" transform="translate(13, 14)">
    <!-- Illuminated Digital Portal Base / Open Book Pages -->
    <path d="M2,28 C10,24 19,27 19,27 C19,27 28,24 36,28 V16 C28,12 19,15 19,15 C19,15 10,12 2,16 Z" fill="url(#eduPrimaryRed)" opacity="0.4" />
    <path d="M19,15 V27" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

    <!-- Upper Graduation Cap Mortarboard (3D Diamond Perspective) -->
    <path d="M19,2 L37,8 L19,14 L1,8 Z" fill="url(#eduPrimaryRed)" />
    
    <!-- Cap Under-Skullcap Base Structure -->
    <path d="M8,11.5 V15 C8,19 13,21 19,21 C25,21 30,19 30,15 V11.5" fill="url(#eduPrimaryRed)" opacity="0.85" />

    <!-- Hanging Academic Tassel Accent -->
    <path d="M19,8 L29,12 V17" fill="none" stroke="url(#eduAccentRed)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="29" cy="18" r="1.5" fill="#FDA4AF" />
  </g>
</svg>
