<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="userPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="60%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="userSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#4C1D95" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <g filter="url(#dropShadow)" transform="translate(11, 15)">
    <!-- Background User Left -->
    <circle cx="8" cy="10" r="4" fill="url(#userSecondary)" opacity="0.7"/>
    <path d="M2,22 C2,17 6,16 8,16 C10,16 14,17 14,22 Z" fill="url(#userSecondary)" opacity="0.7"/>

    <!-- Background User Right -->
    <circle cx="34" cy="10" r="4" fill="url(#userSecondary)" opacity="0.7"/>
    <path d="M28,22 C28,17 32,16 34,16 C36,16 40,17 40,22 Z" fill="url(#userSecondary)" opacity="0.7"/>

    <!-- Foreground Main User -->
    <circle cx="21" cy="8" r="6" fill="url(#userPrimary)" />
    <path d="M10,22 C10,16 16,14 21,14 C26,14 32,16 32,22 Z" fill="url(#userPrimary)" />
  </g>
</svg>
