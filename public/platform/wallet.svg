<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="walletPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="walletAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#4C1D95" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <g filter="url(#dropShadow)" transform="translate(12, 18)">
    <rect x="0" y="4" width="40" height="24" rx="4" fill="url(#walletPrimary)" />
    <rect x="0" y="4" width="40" height="10" rx="4" fill="url(#walletAccent)" />
    <rect x="4" y="0" width="32" height="6" rx="3" fill="url(#walletPrimary)" opacity="0.3" />
    <rect x="26" y="16" width="10" height="3" rx="1.5" fill="#fff" opacity="0.7" />
    <rect x="26" y="21" width="7" height="3" rx="1.5" fill="#fff" opacity="0.4" />
  </g>
</svg>
