<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#9D174D" />
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <g filter="url(#dropShadow)">
    <!-- Base Document Sheet -->
    <rect x="16" y="12" width="28" height="38" rx="4" fill="url(#docGrad)" />
    <!-- Content Placeholder Lines -->
    <line x1="22" y1="20" x2="38" y2="20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="22" y1="28" x2="34" y2="28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="22" y1="36" x2="30" y2="36" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Floating Stylus/Pen Accent -->
    <g transform="rotate(45 34 32)">
      <rect x="40" y="10" width="5" height="22" rx="2.5" fill="url(#penGrad)" />
      <path d="M40,32 L42.5,36 L45,32 Z" fill="#9D174D" />
    </g>
  </g>
</svg>
