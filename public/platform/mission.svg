<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Container squircle base in Brand Corporate Navy with true alpha corners -->
  <rect width="64" height="64" rx="18" fill="#0F1D40" />

  <!-- Concentric Target / Mission Graphic -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" transform="translate(32, 32)">
    <!-- Outer Ring -->
    <circle r="13" />
    <!-- Middle Ring -->
    <circle r="7.5" />
    <!-- Center Bullseye Node -->
    <circle r="2" fill="#FFFFFF" />
  </g>
</svg>
