<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Uniform background card glow -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Vibrant violet-to-indigo gradient for the main portfolio body -->
    <linearGradient id="servicesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <!-- Drop shadow filter for consistent 3D depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#4C1D95" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <!-- Briefcase/Portfolio Icon -->
  <g filter="url(#dropShadow)" transform="translate(14, 15)">
    <!-- Handle -->
    <path d="M12,4 C12,1.8 13.8,0 16,0 C18.2,0 20,1.8 20,4 L20,6 L12,6 Z" fill="#A78BFA" opacity="0.8" />
    
    <!-- Main Case Body -->
    <rect x="2" y="6" width="32" height="26" rx="5" fill="url(#servicesGrad)" />
    
    <!-- Front Clasp / Accent Geometry -->
    <rect x="15" y="16" width="6" height="6" rx="1.5" fill="#FFFFFF" opacity="0.95" />
    
    <!-- Clean accent paths representing dynamic exchange/offering -->
    <path d="M6,12 L12,12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    <path d="M24,12 L30,12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
