<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Standardized panel background card glow -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Premium emerald-to-teal conservation primary gradient -->
    <linearGradient id="conservationPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <!-- High-visibility cyan gradient for the active resource/network node -->
    <linearGradient id="conservationAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <!-- Drop shadow filter tuned for deep green/organic undertones -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#064E3B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <!-- Conservation Graphics Group -->
  <g filter="url(#dropShadow)" transform="translate(14, 13)">
    <!-- Background Supporting Leaf Layer (Tech-Grid Texture) -->
    <path d="M18,3 C18,3 6,11 6,22 C6,29 11,34 18,34 C18,34 22,25 22,22 C22,11 18,3 18,3 Z" fill="url(#conservationPrimary)" opacity="0.4" />
    
    <!-- Foreground Main Conservation Leaf -->
    <path d="M18,1 C18,1 30,10 30,22 C30,29 25,34 18,34 C11,34 6,29 6,22 C6,10 18,1 18,1 Z" fill="url(#conservationPrimary)" />
    
    <!-- Stylized Geometric Leaf Veins / Resource Pathways -->
    <path d="M18,34 V12 M18,26 L24,20 M18,21 L26,15 M18,26 L12,20 M18,21 L10,15" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Illuminated Network Core / Carbon-Credit Asset Node -->
    <circle cx="18" cy="10" r="4.5" fill="url(#conservationAccent)" />
    <circle cx="18" cy="10" r="1.5" fill="#FFFFFF" />
  </g>
</svg>
