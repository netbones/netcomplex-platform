<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Standardized panel background card glow -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Deep violet-to-indigo gradient for the main featured hero slide -->
    <linearGradient id="carouselPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <!-- High-visibility cyan gradient for active pagination and focus elements -->
    <linearGradient id="carouselAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <!-- Drop shadow filter for consistent 3D depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#4C1D95" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <!-- Hero Carousel Graphics Group -->
  <g filter="url(#dropShadow)" transform="translate(11, 13)">
    <!-- Background Slide Layer (Left Stack Depth) -->
    <rect x="0" y="5" width="36" height="20" rx="3" fill="url(#carouselPrimary)" opacity="0.3" transform="rotate(-4, 18, 15)" />

    <!-- Background Slide Layer (Right Stack Depth) -->
    <rect x="6" y="5" width="36" height="20" rx="3" fill="url(#carouselPrimary)" opacity="0.3" transform="rotate(4, 18, 15)" />

    <!-- Main Front Hero Slide Card -->
    <rect x="3" y="3" width="36" height="22" rx="4" fill="url(#carouselPrimary)" />

    <!-- Hero Content Wireframes (Image & Subtext representation) -->
    <rect x="7" y="7" width="10" height="8" rx="1.5" fill="#FFFFFF" opacity="0.4" />
    <circle cx="12" cy="11" r="2" fill="url(#carouselAccent)" />
    
    <rect x="20" y="7" width="12" height="2.5" rx="1" fill="#FFFFFF" opacity="0.9" />
    <rect x="20" y="12" width="8" height="1.5" rx="0.5" fill="#FFFFFF" opacity="0.6" />

    <!-- Navigation Arrows -->
    <path d="M5,14 L3,14 M3,14 L5,12 M3,14 L5,16" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
    <path d="M37,14 L39,14 M39,14 L37,12 M39,14 L37,16" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />

    <!-- Carousel Pagination Indicators -->
    <g transform="translate(11, 31)">
      <circle cx="0" cy="0" r="2" fill="#4C1D95" opacity="0.3" />
      <rect x="5" y="-2" width="10" height="4" rx="2" fill="url(#carouselAccent)" />
      <circle cx="20" cy="0" r="2" fill="#4C1D95" opacity="0.3" />
    </g>
  </g>
</svg>
