<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Standardized panel background card glow (same as all previous SVGs) -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Premium red-to-magenta gradient for the active dispute markers -->
    <linearGradient id="disputePrimaryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <!-- Cyan accent for the underlying document/resolution pathway -->
    <linearGradient id="disputeAccentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <!-- Drop shadow filter tuned to match the deep red/crimson undertones -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#831843" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <!-- Dispute Graphics Group -->
  <g filter="url(#dropShadow)" transform="translate(16, 14)">
    <!-- Underlying Formal Document (Cyan pathway to resolution) -->
    <path d="M4,2 H28 C30.2,2 32,3.8 32,6 V26 C32,28.2 30.2,30 28,30 H4 C1.8,30 0,28.2 0,26 V6 C0,3.8 1.8,2 4,2 Z" fill="url(#disputeAccentCyan)" opacity="0.6" />
    
    <!-- Stylized "Dispute" Signature Line/Clasp and Header -->
    <rect x="6" y="6" width="20" height="3" rx="1.5" fill="#FFFFFF" opacity="0.9" />
    <rect x="6" y="24" width="20" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.6" />
    <rect x="18" y="24" width="8" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.6" />

    <!-- Clashing Elements / Point of Conflict (Red) -->
    <g transform="translate(6, 12)">
      <!-- Divergent Arrow Paths -->
      <path d="M2,6 C2,6 8,0 14,0 C14,0 20,6 20,6" fill="none" stroke="url(#disputePrimaryRed)" stroke-width="2.5" stroke-linecap="round" />
      <path d="M2,6 C2,6 8,12 14,12 C14,12 20,6 20,6" fill="none" stroke="url(#disputePrimaryRed)" stroke-width="2.5" stroke-linecap="round" />
      
      <!-- Center Conflict Point/Resolution Circle -->
      <circle cx="10" cy="6" r="4.5" fill="url(#disputePrimaryRed)" />
      
      <!-- Central X/Alert indicator inside conflict circle -->
      <line x1="8.5" y1="4.5" x2="11.5" y2="7.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="11.5" y1="4.5" x2="8.5" y2="7.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
