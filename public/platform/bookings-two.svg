<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Standardized panel background card glow -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    
    <!-- Deep violet primary gradient for the booking stack -->
    <linearGradient id="bookingPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="60%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    
    <!-- Teal/Emerald gradient for the foreground active slot checkmark -->
    <linearGradient id="bookingSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <!-- Drop shadow filter for consistent depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#4C1D95" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <!-- Facility Bookings Graphics Group -->
  <g filter="url(#dropShadow)" transform="translate(13, 14)">
    <!-- Main stacked time/facility slots -->
    <g transform="translate(0, 0)">
      <!-- Back, inactive slots (lower opacity) -->
      <rect x="0" y="2" width="30" height="8" rx="2.5" fill="url(#bookingPrimary)" opacity="0.3" />
      <rect x="2" y="10" width="30" height="8" rx="2.5" fill="url(#bookingPrimary)" opacity="0.5" />
      
      <!-- Middle slot -->
      <rect x="4" y="18" width="30" height="8" rx="2.5" fill="url(#bookingPrimary)" opacity="0.8" />
      
      <!-- Detailing lines (e.g., time separators) -->
      <line x1="8" y1="22" x2="30" y2="22" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- Foreground confirmed reservation indicator -->
    <g transform="translate(12, 14)">
      <!-- Target confirmed slot -->
      <rect x="0" y="0" width="22" height="22" rx="6" fill="#FFFFFF" opacity="0.9" />
      
      <!-- Status checkmark and ring -->
      <circle cx="11" cy="11" r="8" fill="url(#bookingSecondary)" />
      <path d="M7,11 L10,14 L15,8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>
</svg>
