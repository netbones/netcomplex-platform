<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Standardized panel background card glow -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Deep violet-to-indigo settings cog body gradient -->
    <linearGradient id="settingsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>
    <!-- Cyan highlight overlay for the secondary accent ring -->
    <linearGradient id="accentRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <!-- Drop shadow filter for consistent depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#3B0764" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <!-- Settings Cog Graphic Layer -->
  <g filter="url(#dropShadow)" transform="translate(32, 32)">
    <!-- Main Mechanical Gear Base -->
    <circle cx="0" cy="0" r="13" fill="url(#settingsGrad)" />
    
    <!-- Stylized Gear Teeth -->
    <path d="M-3,-17 H3 L4,-13 H-4 Z" fill="url(#settingsGrad)" />
    <path d="M-3,13 H3 L4,17 H-4 Z" fill="url(#settingsGrad)" />
    <path d="M-17,-3 V3 L-13,4 V-4 Z" fill="url(#settingsGrad)" />
    <path d="M13,-3 V3 L17,4 V-4 Z" fill="url(#settingsGrad)" />
    
    <!-- Diagonal Teeth Extensions -->
    <path d="M-12,-12 L-8,-8 L-10,-6 L-14,-10 Z" fill="url(#settingsGrad)" />
    <path d="M8,8 L12,12 L10,14 L6,10 Z" fill="url(#settingsGrad)" />
    <path d="M12,-12 L8,-8 L6,-10 L10,-14 Z" fill="url(#settingsGrad)" />
    <path d="M-8,8 L-12,12 L-14,10 L-10,6 Z" fill="url(#settingsGrad)" />

    <!-- Premium Inner Core Ring Accent -->
    <circle cx="0" cy="0" r="7" fill="url(#accentRing)" />
    
    <!-- Central Cutout Hole -->
    <circle cx="0" cy="0" r="3.5" fill="#E8ECFD" />
  </g>
</svg>
