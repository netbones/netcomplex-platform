<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="galleryFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="galleryAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#7C3AED" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <g filter="url(#dropShadow)" transform="translate(12, 10)">
    <!-- Large frame (back) -->
    <rect x="0" y="0" width="28" height="20" rx="3" fill="url(#galleryFrame)" opacity="0.3" transform="rotate(-3, 14, 10)" />
    <!-- Large frame (front) -->
    <rect x="4" y="2" width="28" height="20" rx="3" fill="url(#galleryFrame)" />
    <!-- Image placeholder inside large frame -->
    <rect x="8" y="6" width="8" height="6" rx="1.5" fill="#FFFFFF" opacity="0.4" />
    <circle cx="12" cy="9" r="2" fill="url(#galleryAccent)" />
    <rect x="18" y="6" width="10" height="2" rx="1" fill="#FFFFFF" opacity="0.9" />
    <rect x="18" y="10" width="8" height="1.5" rx="0.5" fill="#FFFFFF" opacity="0.6" />
    <rect x="8" y="14" width="20" height="2" rx="1" fill="#FFFFFF" opacity="0.7" />

    <!-- Small frame -->
    <rect x="18" y="16" width="20" height="14" rx="3" fill="url(#galleryFrame)" opacity="0.5" transform="rotate(2, 28, 23)" />
    <rect x="22" y="19" width="6" height="4" rx="1" fill="#FFFFFF" opacity="0.3" />
    <rect x="30" y="19" width="6" height="2" rx="0.5" fill="#FFFFFF" opacity="0.8" />
    <rect x="30" y="22.5" width="4" height="1" rx="0.5" fill="#FFFFFF" opacity="0.5" />
  </g>
</svg>
