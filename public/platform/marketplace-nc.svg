<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F3EFE3" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="netNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="netGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#glassBg)" stroke="#E2E8F0" stroke-width="1" />

  <!-- Graphics Group matching watermarked_img_7325610948174909979.png -->
  <g filter="url(#softShadow)" transform="translate(14, 15)">
    <!-- Base Counter / Stall Foundation Split -->
    <path d="M4,22 H17 V34 H8 C6,34 4,32 4,30 Z" fill="url(#netNavy)" />
    <path d="M17,22 H32 V30 C32,32 30,34 28,34 H17 Z" fill="url(#netGold)" />

    <!-- Canopy/Awning Left Side (Navy Dominant) -->
    <path d="M2,6 H17 L17,22 H5 Z" fill="url(#netNavy)" />
    <!-- Canopy/Awning Right Side (Gold Dominant) -->
    <path d="M17,6 H34 L31,22 H17 Z" fill="url(#netGold)" />

    <!-- Overlapping Canopy Awning Stripes for 3D Definition -->
    <path d="M7,6 L9,22 H13 L11,6 Z" fill="#FFFFFF" opacity="0.2" />
    <path d="M21,6 L23,22 H27 L25,6 Z" fill="#1E293B" opacity="0.3" />

    <!-- Floating Mini Shopping Cart Line Asset -->
    <path d="M10,25 H14 L17,30 H24 L26,26" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="32" r="1" fill="#FFFFFF"/>
    <circle cx="23" cy="32" r="1" fill="#FFFFFF"/>
  </g>
</svg>
