<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Standardized panel background card glow -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Deep indigo-to-purple primary wallet body gradient -->
    <linearGradient id="walletPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <!-- High-visibility cyan gradient for the card accent/token layer -->
    <linearGradient id="walletAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <!-- Drop shadow filter for consistent 3D panel depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#4338CA" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <!-- Wallet Graphic Group -->
  <g filter="url(#dropShadow)" transform="translate(14, 16)">
    <!-- Peeking Digital Asset Card (Background Layer) -->
    <path d="M6,2 C6,0.9 6.9,0 8,0 H26 C27.1,0 28,0.9 28,2 V10 H6 Z" fill="url(#walletAccent)" opacity="0.85" />
    <line x1="10" y1="4" x2="18" y2="4" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Main Wallet Back Shell -->
    <rect x="0" y="6" width="34" height="24" rx="5" fill="url(#walletPrimary)" />
    
    <!-- Front Flap / Bi-fold Layer (Creates 3D structural overlapping depth) -->
    <path d="M0,10 C0,7.8 1.8,6 4,6 H30 C32.2,6 34,7.8 34,10 V26 C34,28.2 32.2,30 30,30 H4 C1.8,30 0,28.2 0,26 Z" fill="url(#walletPrimary)" />

    <!-- Metallic Fastening Clasp Geometry -->
    <path d="M22,14 H34 V22 H22 C19.8,22 18,20.2 18,18 C18,15.8 19.8,14 22,14 Z" fill="#4338CA" opacity="0.6" />
    <circle cx="24" cy="18" r="2.5" fill="#FFFFFF" />
    <circle cx="24" cy="18" r="1" fill="#22D3EE" />
  </g>
</svg>
