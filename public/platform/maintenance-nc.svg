<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Frosted glass background card matching watermarked_img_7325610948174909979.png -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F3EFE3" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Left-side Metallic Corporate Navy Gradient -->
    <linearGradient id="netNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- Right-side Metallic Anchor Gold Gradient -->
    <linearGradient id="netGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <!-- Soft dark shadow for layout depth over the cream canvas -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container Base Card (True alpha transparency outside the border radius) -->
  <rect width="64" height="64" rx="16" fill="url(#glassBg)" stroke="#E2E8F0" stroke-width="1" />

  <!-- Graphics Group matching the exact wrench design in watermarked_img_7325610948174909979.png -->
  <g filter="url(#softShadow)" transform="translate(14, 14)">
    <!-- Combined ClipPath to split the diagonal wrench cleanly down the center axis -->
    <g>
      <!-- Left Side Split (Corporate Navy) -->
      <g clip-path="url(#leftHalf)">
        <path d="M31.2,4.8 C27.5,1.1 21.5,1.1 17.8,4.8 C14.9,7.7 14.3,12 16.2,15.5 L3.2,28.5 C1.6,30.1 1.6,32.7 3.2,34.3 C4.8,35.9 7.4,35.9 9,34.3 L22,21.3 C25.5,23.2 29.8,22.6 32.7,19.7 C36.4,16 36.4,10 32.7,6.3 L31.2,4.8 Z M21.3,11.3 C20.2,12.4 18.3,12.4 17.2,11.3 C16.1,10.2 16.1,8.3 17.2,7.2 C18.3,6.1 20.2,6.1 21.3,7.2 C22.4,8.3 22.4,10.2 21.3,11.3 Z" fill="url(#netNavy)" />
      </g>
      
      <!-- Right Side Split (Anchor Gold) -->
      <g clip-path="url(#rightHalf)">
        <path d="M31.2,4.8 C27.5,1.1 21.5,1.1 17.8,4.8 C14.9,7.7 14.3,12 16.2,15.5 L3.2,28.5 C1.6,30.1 1.6,32.7 3.2,34.3 C4.8,35.9 7.4,35.9 9,34.3 L22,21.3 C25.5,23.2 29.8,22.6 32.7,19.7 C36.4,16 36.4,10 32.7,6.3 L31.2,4.8 Z M21.3,11.3 C20.2,12.4 18.3,12.4 17.2,11.3 C16.1,10.2 16.1,8.3 17.2,7.2 C18.3,6.1 20.2,6.1 21.3,7.2 C22.4,8.3 22.4,10.2 21.3,11.3 Z" fill="url(#netGold)" />
      </g>
    </g>
  </g>

  <!-- Inline Clip Paths to bisect the canvas evenly for the 3D finish -->
  <clipPath id="leftHalf">
    <rect x="-10" y="-10" width="28" height="60" />
  </clipPath>
  <clipPath id="rightHalf">
    <rect x="18" y="-10" width="40" height="60" />
  </clipPath>
</svg>
