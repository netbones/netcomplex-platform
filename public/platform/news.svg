<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Standardized panel background card glow -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Deep indigo-to-purple primary news stack gradient -->
    <linearGradient id="newsPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <!-- Cyan/Teal gradient for the modern live updates accent badge -->
    <linearGradient id="newsAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <!-- Drop shadow filter for consistent depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#4338CA" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <!-- News Graphic Elements Group -->
  <g filter="url(#dropShadow)" transform="translate(14, 15)">
    <!-- Back Folded Paper Layer -->
    <path d="M4,4 L32,2 L34,26 L6,28 Z" fill="url(#newsPrimary)" opacity="0.5" />

    <!-- Main Front Newspaper Sheet -->
    <rect x="0" y="6" width="30" height="24" rx="3" fill="url(#newsPrimary)" />
    
    <!-- Stylized Editorial Header Blocks -->
    <rect x="4" y="11" width="10" height="5" rx="1" fill="#FFFFFF" opacity="0.95" />
    <rect x="17" y="11" width="9" height="2" rx="0.5" fill="#FFFFFF" opacity="0.6" />
    <rect x="17" y="15" width="9" height="2" rx="0.5" fill="#FFFFFF" opacity="0.6" />
    
    <!-- Body Text Columns -->
    <line x1="4" y1="21" x2="26" y2="21" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <line x1="4" y1="25" x2="20" y2="25" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

    <!-- Live Update Signal Badge (Top Right) -->
    <circle cx="28" cy="4" r="5" fill="url(#newsAccent)" />
    <circle cx="28" cy="4" r="2" fill="#FFFFFF" />
  </g>
</svg>
