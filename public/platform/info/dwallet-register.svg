<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Halftone Grid Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="2" cy="2" r="1.2" fill="#d0d7de" />
    </pattern>

    <!-- Subtle Shadows & Blurs -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#2c3e50" flood-opacity="0.08" />
    </filter>

    <style>
      .bg-dots { fill: url(#dotPattern); }
      .primary-green { fill: #76d795; }
      .dark-slate { fill: #2c3e50; }
      .mid-slate { fill: #4a5d6e; }
      .light-gray { fill: #f1f4f6; }
      .skin-tone { fill: #f0a08e; }
      .white { fill: #ffffff; }
      .gold { fill: #fcd34d; }
      
      .stroke-dark { stroke: #2c3e50; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-thin { stroke: #2c3e50; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-green { stroke: #76d795; stroke-width: 2.5; stroke-linecap: round; }
      
      .pattern-sparkle { fill: #76d795; stroke: #2c3e50; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- BACKGROUND ELEMENTS -->
  <g class="background-decorations">
    <!-- Rotated Grid Box (Matching Reference) -->
    <polygon points="120,100 680,80 720,420 80,440" class="bg-dots" opacity="0.7" />

    <!-- Abstract Floating Gears -->
    <g transform="translate(140, 160)" class="light-gray" opacity="0.8">
      <path d="M20,0 L24,6 L31,3 L33,10 L40,11 L39,18 L45,22 L41,28 L45,34 L39,37 L39,44 L32,44 L29,51 L22,48 L17,53 L13,47 L6,47 L6,40 L0,36 L3,30 L0,23 L6,20 L5,13 L12,11 L13,4 L20,6 Z" />
      <circle cx="22" cy="26" r="10" fill="#ffffff" />
    </g>
    <g transform="translate(640, 220) scale(0.7)" fill="#d0d7de" opacity="0.6">
      <circle cx="20" cy="20" r="25" />
    </g>

    <!-- Floating Sparkles & Accents -->
    <!-- Idea/Reward Sparkle Left -->
    <g transform="translate(180, 260)">
      <path d="M0,-15 L4,-4 L15,0 L4,4 L0,15 L-4,4 L-15,0 L-4,-4 Z" class="primary-green" />
    </g>
    <!-- Idea/Reward Sparkle Right -->
    <g transform="translate(620, 140)">
      <path d="M0,-20 L5,-5 L20,0 L5,5 L0,20 L-5,5 L-20,0 L-5,-5 Z" class="primary-green" />
    </g>
    
    <!-- Floating Coins / Reward Bubbles in Air -->
    <circle cx="260" cy="180" r="12" fill="#76d795" opacity="0.3" />
    <circle cx="580" cy="320" r="8" fill="#76d795" opacity="0.4" />
  </g>

  <!-- MAIN SCENE CONTAINER -->
  <g id="main-illustration" transform="translate(0, 20)">

    <!-- DIGITAL WALLET (PHONE / SCREEN DISPLAY) -->
    <g id="dwallet-device" filter="url(#softShadow)">
      <!-- Outer Device Base -->
      <rect x="260" y="160" width="280" height="380" rx="24" class="white" />
      <rect x="260" y="160" width="280" height="380" rx="24" fill="none" class="stroke-dark" />
      
      <!-- Screen Inner Header -->
      <rect x="275" y="180" width="250" height="200" rx="12" class="light-gray" />
      
      <!-- Wallet Card Inside Device -->
      <rect x="295" y="200" width="210" height="120" rx="12" class="dark-slate" />
      <rect x="315" y="280" width="60" height="12" rx="4" class="primary-green" />
      <circle cx="470" cy="230" r="16" fill="#ffffff" opacity="0.2" />
      <circle cx="485" cy="230" r="16" fill="#76d795" opacity="0.4" />
      
      <!-- Balance Graphic -->
      <text x="315" y="240" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff">dWallet</text>
      <text x="315" y="262" font-family="sans-serif" font-weight="bold" font-size="20" fill="#76d795">+$1,250.00</text>

      <!-- App Action Buttons -->
      <rect x="295" y="340" width="100" height="12" rx="6" class="mid-slate" />
      <rect x="295" y="362" width="150" height="8" rx="4" fill="#d0d7de" />
      <rect x="295" y="378" width="120" height="8" rx="4" fill="#d0d7de" />

      <!-- Success Reward Banner at Bottom of Screen -->
      <rect x="295" y="410" width="210" height="50" rx="10" class="primary-green" />
      <text x="345" y="440" font-family="sans-serif" font-weight="bold" font-size="15" class="dark-slate">Reward Claimed!</text>
      
      <!-- Checkmark Icon inside Banner -->
      <circle cx="320" cy="435" r="12" class="white" />
      <path d="M314,435 L318,439 L326,430" fill="none" class="stroke-green" />
    </g>

    <!-- HAND GIVING / RECEIVING REWARD (LEFT - PLATFORM) -->
    <g id="hand-platform">
      <!-- Sleeve (Charcoal Suit Style like reference) -->
      <path d="M 80,380 L 210,350 L 210,410 L 80,450 Z" class="dark-slate" />
      <path d="M 80,380 L 210,350 L 210,410 L 80,450 Z" fill="none" class="stroke-dark" />
      
      <!-- White Cuff -->
      <polygon points="210,350 222,347 222,407 210,410" class="white" />
      <polygon points="210,350 222,347 222,407 210,410" fill="none" class="stroke-dark" />

      <!-- Hand Holding Gift Box -->
      <path d="M 222,360 C 240,360 250,370 265,375 C 260,385 250,390 235,390 L 222,390 Z" class="skin-tone" />
      <path d="M 222,360 C 240,360 250,370 265,375" fill="none" class="stroke-dark" />
    </g>

    <!-- FLOATING REWARD GIFT BOX (CENTER LEFT) -->
    <g id="reward-gift" transform="translate(210, 260)" filter="url(#softShadow)">
      <!-- Gift Base -->
      <rect x="0" y="20" width="70" height="60" rx="6" class="primary-green" />
      <rect x="0" y="20" width="70" height="60" rx="6" fill="none" class="stroke-dark" />
      
      <!-- Gift Lid -->
      <rect x="-5" y="10" width="80" height="15" rx="4" class="white" />
      <rect x="-5" y="10" width="80" height="15" rx="4" fill="none" class="stroke-dark" />
      
      <!-- Ribbon Vertical -->
      <rect x="28" y="20" width="14" height="60" class="dark-slate" />
      <rect x="28" y="10" width="14" height="15" class="dark-slate" />
      
      <!-- Bow -->
      <path d="M 20,2 C 10,-10 35,-10 35,10 C 35,-10 60,-10 50,2 C 40,10 35,10 35,10 Z" class="dark-slate" />
      <path d="M 20,2 C 10,-10 35,-10 35,10 C 35,-10 60,-10 50,2 C 40,10 35,10 35,10 Z" fill="none" class="stroke-dark" />
    </g>

    <!-- HAND RECEIVING / REACHING (RIGHT - USER) -->
    <g id="hand-user">
      <!-- Sleeve (Mint patterned green like reference woman's top) -->
      <path d="M 720,380 L 580,340 L 570,400 L 720,460 Z" class="primary-green" />
      <path d="M 720,380 L 580,340 L 570,400 L 720,460 Z" fill="none" class="stroke-dark" />
      
      <!-- Pattern lines on sleeve -->
      <path d="M 620,360 L 625,370 M 660,375 L 665,385 M 600,380 L 605,390" class="stroke-dark" stroke-width="2" />

      <!-- Hand Outer Shape -->
      <path d="M 580,340 C 550,335 520,350 495,360 C 490,368 500,378 515,375 C 530,372 550,370 570,380 Z" class="skin-tone" />
      <path d="M 580,340 C 550,335 520,350 495,360 C 490,368 500,378 515,375 C 530,372 550,370 570,380" fill="none" class="stroke-dark" />
      
      <!-- Fingers detail -->
      <path d="M 520,362 C 505,365 490,372 498,380 C 510,380 525,372 535,370" class="skin-tone" />
      <path d="M 520,362 C 505,365 490,372 498,380" fill="none" class="stroke-dark" />
    </g>

    <!-- FLOATING REWARD COINS & STARS (BURST EFFECT) -->
    <g id="reward-tokens">
      <!-- Big Gold Token 1 -->
      <g transform="translate(350, 110)" filter="url(#softShadow)">
        <circle cx="0" cy="0" r="28" class="gold" />
        <circle cx="0" cy="0" r="28" fill="none" class="stroke-dark" />
        <circle cx="0" cy="0" r="21" fill="none" class="stroke-dark" stroke-dasharray="4 3" />
        <!-- Star in Coin -->
        <polygon points="0,-10 3,-3 10,-2 5,3 7,10 0,6 -7,10 -5,3 -10,-2 -3,-3" class="dark-slate" />
      </g>

      <!-- Token 2 (Right Floating) -->
      <g transform="translate(490, 130)" filter="url(#softShadow)">
        <circle cx="0" cy="0" r="22" class="gold" />
        <circle cx="0" cy="0" r="22" fill="none" class="stroke-dark" />
        <text x="-6" y="7" font-family="sans-serif" font-weight="bold" font-size="18" class="dark-slate">$</text>
      </g>

      <!-- Token 3 (Small Left Floating) -->
      <g transform="translate(260, 130)">
        <circle cx="0" cy="0" r="15" class="gold" />
        <circle cx="0" cy="0" r="15" fill="none" class="stroke-dark" />
        <text x="-4" y="5" font-family="sans-serif" font-weight="bold" font-size="12" class="dark-slate">$</text>
      </g>

      <!-- Floating Reward Stars -->
      <polygon points="430,70 434,80 445,81 437,88 439,98 430,93 421,98 423,88 415,81 426,80" class="primary-green" stroke="#2c3e50" stroke-width="1.5" />
      <polygon points="230,210 233,217 240,218 235,223 236,230 230,226 224,230 225,223 220,218 227,217" class="gold" stroke="#2c3e50" stroke-width="1.5" />
      
      <!-- Energy / Motion Lines -->
      <path d="M 350,70 L 350,55" class="stroke-dark" stroke-width="2" />
      <path d="M 380,75 L 390,65" class="stroke-dark" stroke-width="2" />
      <path d="M 320,75 L 310,65" class="stroke-dark" stroke-width="2" />
    </g>

    <!-- GROUND/FLOOR LINE -->
    <line x1="60" y1="520" x2="740" y2="520" class="stroke-dark" stroke-width="3" />
  </g>
</svg>
