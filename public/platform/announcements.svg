<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3F1FB" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="2.5" flood-color="#4C1D95" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <g filter="url(#dropShadow)" transform="translate(14, 15) rotate(-10 16 16)">
    <!-- Megaphone Handle -->
    <rect x="8" y="18" width="5" height="10" rx="2.5" fill="url(#hornGrad)" transform="rotate(15 10 18)" />
    
    <!-- Main Cone Body -->
    <path d="M6,14 L22,6 L26,24 L6,16 Z" fill="url(#hornGrad)" />
    
    <!-- Front Sound Expander (Bell) -->
    <ellipse cx="24" cy="15" rx="3" ry="9" fill="url(#bellGrad)" />
    
    <!-- Sound Waves Base -->
    <path d="M31,9 C33,12 33,18 31,21" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M35,6 C38,10 38,20 35,24" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  </g>
</svg>
