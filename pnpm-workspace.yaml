packages:
  - . # single-project workspace, set to '.' if not in a monorepo
allowBuilds:
  '-': true
  a: true
  c: true
  d: true
  e: true
  i: true
  n: true
  o: true
  p: true
  supabase: true

# Overrides moved from package.json#pnpm.overrides (deprecated in pnpm 10+).
# See https://pnpm.io/settings for the authoritative config reference.
overrides:
  # Varlock integration patch
  '@next/env': 'npm:@varlock/nextjs-integration'
  # Supply-chain audit hardening (ADVISORY-003)
  cross-spawn: 7.0.6
  defu: 6.1.5
  drizzle-orm: 0.45.2
  fast-xml-builder: 1.1.7
  kysely: 0.28.17
  lodash: 4.18.0
  tar: 7.5.11
  tmp: 0.2.6
  undici: 7.24.6
  valibot: 1.2.0
  vite: 8.0.16

patchedDependencies:
  validation-better-auth@1.3.4: patches/validation-better-auth@1.3.4.patch
